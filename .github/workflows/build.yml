name: Build

on:
  workflow_dispatch:          # manual: build artifacts only (no release)
    inputs:
      platforms:              # comma-separated subset; empty = all
        description: 'Platforms to build (mac-arm64,mac-x64,win-x64,linux-x64,linux-arm64). Empty builds all.'
        required: false
        default: ''
  push:
    tags: ['v*']              # tag push: build + publish GitHub Release

permissions:
  contents: write

jobs:
  mac-arm64:
    # 主架构，tag 发布时上传（写 latest-mac.yml）
    if: ${{ !inputs.platforms || contains(inputs.platforms, 'mac-arm64') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-platform
        with:
          prepare: darwin-arm64
          build: --mac --arm64
          publish: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'always' || 'never' }}

  mac-x64:
    # Rosetta 交叉；只出产物，永不上传（避免覆盖 latest-mac.yml）
    if: ${{ !inputs.platforms || contains(inputs.platforms, 'mac-x64') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-platform
        with:
          prepare: darwin-x64
          build: --mac --x64
          publish: never

  linux-x64:
    if: ${{ !inputs.platforms || contains(inputs.platforms, 'linux-x64') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-platform
        with:
          prepare: linux-x64
          build: --linux --x64
          publish: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'always' || 'never' }}

  linux-arm64:
    if: ${{ !inputs.platforms || contains(inputs.platforms, 'linux-arm64') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-platform
        with:
          prepare: linux-arm64
          build: --linux --arm64
          publish: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'always' || 'never' }}

  win-x64:
    if: ${{ !inputs.platforms || contains(inputs.platforms, 'win-x64') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-platform
        with:
          prepare: win32-x64
          build: --win --x64
          publish: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'always' || 'never' }}
