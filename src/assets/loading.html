<!DOCTYPE html>

  <title>dshed</title>

    html, body { height: 100%; margin: 0; background: rgb(21, 21, 23); /* neutral-bluish-950 */ color: #e6e8eb; }

           font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }

  </style>
</head>

    var lang = new URLSearchParams(location.search).get('lang')
    if (lang === 'zh') {
      document.querySelector('.sub').textContent = document.querySelector('.sub').dataset.zh
